<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Terminal Access | Clinic Flow SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex items-center justify-center p-4 relative">

    <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#e2e8f0_1px,transparent_1px),linear-gradient(to_bottom,#e2e8f0_1px,transparent_1px)] bg-[size:3rem_3rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_40%,transparent_100%)] pointer-events-none">
    </div>

    <div class="max-w-md w-full bg-white border border-slate-200 rounded-xl shadow-sm p-8 space-y-6 relative z-10">

        <div class="absolute top-0 left-0 right-0 h-[3px] bg-sky-500 rounded-t-xl">
        </div>

        <div class="text-center space-y-3">
            <div
                class="inline-flex items-center justify-center w-12 h-12 bg-sky-50 text-sky-600 border border-sky-100 rounded-xl text-xl font-bold">
                🪪
            </div>
            <div class="space-y-1">
                <h2 class="text-xl font-extrabold text-slate-900 tracking-tight uppercase">Staff Workspace</h2>
                <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Clinical Workflow Access Node
                </p>
            </div>
        </div>

        <div id="error-box"
            class="hidden p-3.5 rounded-lg text-xs font-bold text-center bg-rose-50 border border-rose-200 text-rose-600 tracking-wide">
        </div>

        <form id="staff-login-form" class="space-y-4">

            <div>
                <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Workspace Email
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                        </svg>
                    </div>
                    <input type="email" id="staff-email" required placeholder="yourname@clinic.com"
                        class="w-full bg-white border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/10 transition-all font-medium">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider">
                        Assigned Access PIN
                    </label>
                    <span class="text-[9px] text-slate-400 font-medium">Provided by Administrator</span>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <input type="password" id="staff-pin" required placeholder="Enter terminal PIN code"
                        autocomplete="off"
                        class="w-full bg-white border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/10 transition-all font-mono tracking-widest">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs py-3.5 rounded-lg transition-colors tracking-wider uppercase mt-2 cursor-pointer shadow-sm shadow-sky-600/10">
                Enter Duty Station
            </button>
        </form>

        <div class="border-t border-slate-100 pt-4 text-center">
            <a href="/index.html"
                class="text-[10px] text-slate-400 hover:text-slate-600 font-bold tracking-wide uppercase transition-colors">
                ◀ Main Consumer Portal
            </a>
        </div>
    </div>

    <script type="module" src="/src/pages/staffLogin.js"></script>
</body>

</html>
