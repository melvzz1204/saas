<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Master Console | Root Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Grid Background & Ambient Lighting FX -->
    <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_40%,#000_70%,transparent_100%)] opacity-40">
    </div>
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-indigo-600/15 blur-[120px] pointer-events-none">
    </div>

    <!-- Main Gateway Box -->
    <div
        class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6 relative z-10">

        <!-- Glowing Top Accent Line -->
        <div
            class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-[2px] bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full">
        </div>

        <div class="text-center space-y-3">
            <div
                class="inline-flex items-center justify-center w-12 h-12 bg-indigo-950/60 text-indigo-400 border border-indigo-800/50 rounded-xl text-xl font-bold shadow-inner">
                🛡️
            </div>
            <div class="space-y-1">
                <h2 class="text-xl font-black text-white tracking-tight uppercase">SaaS Platform Console</h2>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Master Administration</p>
            </div>
        </div>

        <!-- Dynamic Error Banner -->
        <div id="error-box"
            class="hidden p-3.5 rounded-xl text-xs font-bold text-center bg-rose-950/50 border border-rose-800/80 text-rose-300 tracking-wide">
        </div>

        <form id="saas-admin-login-form" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Master
                    Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                        </svg>
                    </div>
                    <input type="email" id="saas-admin-email" required placeholder="admin@saasplatform.com"
                        class="w-full bg-slate-950/60 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-all font-medium">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Root Key
                    Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
                        </svg>
                    </div>
                    <input type="password" id="saas-admin-password" required placeholder="••••••••••••"
                        class="w-full bg-slate-950/60 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-all">
                </div>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3.5 rounded-xl shadow-lg shadow-indigo-600/20 transition-all transform active:scale-[0.99] tracking-wider uppercase mt-2 cursor-pointer border border-indigo-500/20">
                Authenticate login
            </button>
        </form>

        <div class="border-t border-slate-800/80 pt-4 text-center">
            <a href="/index.html"
                class="text-[10px] text-slate-500 hover:text-slate-400 font-bold uppercase tracking-wider transition-colors">
                ← Return to Consumer Landing Page
            </a>
        </div>
    </div>

    <script src="/src/pages/saasAdminLogin.js"></script>
    <!-- 🔑 AUTO SHOW/HIDE PASSWORD TOGGLE -->
    <script src="/src/util/passwordToggle.js"></script>
</body>

</html>
