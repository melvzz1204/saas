<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentist Dashboard</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

            <!-- Left Side: Logo and Title -->
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-xl bg-sky-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-sky-600/20">
                    🦷
                </div>
                <div>
                    <h1 class="text-sm font-black text-slate-900 tracking-tight uppercase"></h1>
                    <p class="text-[10px] text-slate-400 font-bold tracking-wider uppercase">Clinical Provider Deck</p>
                </div>
            </div>

            <!-- Right Side: Logout Button -->
            <button id="dentist-logout-btn"
                class="flex items-center px-4 py-2 bg-rose-600 text-white text-sm font-bold rounded-lg hover:bg-rose-700 transition-all cursor-pointer">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
                Log Out
            </button>

        </div>
    </header>

    <main
        class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">

        <div class="xl:col-span-2 space-y-6">

            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-sky-600"></div>

                <div
                    class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-6">
                    <div>
                        <span
                            class="text-[9px] font-black text-sky-600 bg-sky-50 border border-sky-200 px-2 py-0.5 rounded-md uppercase tracking-wider">Active
                            Treatment Unit</span>
                        <h2 id="active-patient-name" class="text-xl font-black text-slate-900 tracking-tight mt-1">
                            Loading Case...</h2>
                        <!-- 🎯 FIXED: Appended secure clear identification string -->
                        <p id="active-procedure-container" class="text-xs text-slate-500 font-medium mt-0.5">Syncing
                            treatment data</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <!--     <div class="text-right">
                            <p class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Session Clock</p>
                            <p id="session-timer" class="text-lg font-mono font-bold text-slate-800">00:00</p>
                        </div> -->
                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xl">🪑</div>
                    </div>
                </div>

                <!-- Arc Map Component Block -->
                <div class="space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Interactive 16-Tooth
                            Dental Arc Map</h3>
                        <div class="inline-flex rounded-lg bg-slate-100 p-0.5 border border-slate-200/80">
                            <button id="toggle-maxillary" type="button"
                                class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-md cursor-pointer transition-all bg-white text-slate-800 shadow-2xs">
                                Maxillary (Upper)
                            </button>
                            <button id="toggle-mandibular" type="button"
                                class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-md cursor-pointer transition-all text-slate-500 hover:text-slate-800">
                                Mandibular (Lower)
                            </button>
                        </div>
                    </div>

                    <div id="odontogram-container"
                        class="border border-slate-200 rounded-xl p-4 bg-slate-50/50 flex flex-wrap justify-center gap-1.5 min-h-[100px] items-center">
                        <!-- Component items compiled via module -->
                    </div>
                </div>

                <form id="clinical-notes-form" class="mt-6 space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Clinical
                            Assessment & Progress Notes</label>
                        <textarea required rows="3"
                            placeholder="Enter localized anesthesia delivery metrics, findings, or adjustments..."
                            class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-hidden focus:border-sky-500 bg-slate-50 font-medium text-slate-800"></textarea>
                    </div>
                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="alert('Diagnostic data backups initialized.')"
                            class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 text-xs font-bold px-4 py-2.5 rounded-xl transition-colors cursor-pointer">
                            Order X-Ray 🩻
                        </button>
                        <button type="submit"
                            class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-colors cursor-pointer shadow-md shadow-sky-600/10">
                            Complete Procedure & Release Patient 💳
                        </button>
                    </div>
                </form>
            </div>

        </div>
        <div class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col h-[610px]">
                <div class="border-b border-slate-100 pb-3 mb-4 flex justify-between items-center">
                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-sky-500 shadow-[0_0_8px_rgba(59,130,246,0.4)]"></span>
                        Assigned Patient
                    </h3>
                    <!-- 🎯 ADDED ID: queue-count -->
                    <span id="queue-count"
                        class="bg-slate-100 text-slate-600 border border-slate-200 text-[10px] font-black px-2 py-0.5 rounded-md">0
                        Left</span>
                </div>

                <!-- 🎯 ADDED ID: queue-container -->
                <div id="queue-container" class="flex-1 overflow-y-auto space-y-3 pr-1">
                    <p class="text-xs font-semibold text-slate-400 text-center py-8">Contacting clinical data stream...
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Main Clinical Orchestration Engine Modules -->
    <script type="module" src="/src/util/teeth.js"></script>
    <script type="module" src="./src/pages/dentistDashboard.js"></script>
</body>

</html>
