<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Single scroll layout preview">
  <defs>
    <linearGradient id="scrollHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="#f8fafc"/>
  <!-- full-bleed hero -->
  <rect x="0" y="0" width="320" height="96" fill="url(#scrollHero)"/>
  <rect x="16" y="12" width="40" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="286" y="10" width="20" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="70" y="40" width="180" height="12" rx="6" fill="#ffffff"/>
  <rect x="96" y="58" width="128" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/>
  <rect x="130" y="72" width="60" height="12" rx="6" fill="#ffffff"/>
  <!-- large stacked sections -->
  <rect x="28" y="112" width="120" height="10" rx="5" fill="#0f172a"/>
  <rect x="28" y="128" width="264" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="28" y="139" width="230" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="28" y="156" width="264" height="20" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- sticky bottom booking bar -->
  <rect x="0" y="184" width="320" height="16" fill="#0f172a"/>
  <rect x="16" y="189" width="120" height="6" rx="3" fill="#64748b"/>
  <rect x="250" y="187" width="56" height="10" rx="5" fill="#06b6d4"/>
</svg>
