<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Split hero layout preview">
  <rect width="320" height="200" fill="#f8fafc"/>
  <!-- header -->
  <rect x="0" y="0" width="320" height="26" fill="#ffffff"/>
  <rect x="16" y="9" width="46" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="214" y="10" width="28" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="250" y="10" width="28" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="286" y="7" width="20" height="12" rx="6" fill="#d4a843"/>
  <!-- left column hero text -->
  <rect x="24" y="46" width="120" height="11" rx="5.5" fill="#0f172a"/>
  <rect x="24" y="62" width="150" height="11" rx="5.5" fill="#0f172a"/>
  <rect x="24" y="82" width="110" height="6" rx="3" fill="#94a3b8"/>
  <rect x="24" y="93" width="90" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="24" y="110" width="52" height="14" rx="7" fill="#1e3a5f"/>
  <rect x="84" y="110" width="52" height="14" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <!-- right column booking panel -->
  <rect x="188" y="42" width="108" height="92" rx="10" fill="#1e3a5f"/>
  <rect x="202" y="56" width="60" height="7" rx="3.5" fill="#d4a843"/>
  <rect x="202" y="72" width="80" height="6" rx="3" fill="#93a4bd"/>
  <rect x="202" y="86" width="80" height="10" rx="5" fill="#2c4a70"/>
  <rect x="202" y="102" width="80" height="10" rx="5" fill="#2c4a70"/>
  <rect x="202" y="118" width="80" height="10" rx="5" fill="#d4a843"/>
  <!-- alternating full-width band -->
  <rect x="0" y="150" width="320" height="50" fill="#eef2f6"/>
  <rect x="24" y="164" width="120" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="160" y="166" width="90" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="160" y="180" width="120" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="160" y="189" width="104" height="5" rx="2.5" fill="#cbd5e1"/>
</svg>
