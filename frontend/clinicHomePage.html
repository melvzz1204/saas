<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Gentle, modern dental care. Book your appointment online, meet our dentists, and see transparent pricing before you visit.">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
            background: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            text-align: center;
            padding: 1.5rem;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid #cbd5e1;
            border-top-color: #0f766e;
            animation: spin 0.8s linear infinite;
        }
        .loader p { margin: 0; font-size: 0.9rem; font-weight: 600; color: #64748b; }
        #loader-error {
            display: none;
            max-width: 30rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>

<body>
    <!--
      Public landing LOADER.
      Every public/admin link points here (/clinicHomePage.html?clinic=<slug>).
      This resolves the clinic's chosen landing TEMPLATE and forwards to the
      matching template document under /clinic-templates/. The template files
      are full, independent pages (classic.html, split.html, scroll.html) and
      keep using their own controllers — this file only decides which one loads.
    -->
    <div class="loader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading clinic…</p>
        <div id="loader-error" role="alert"></div>
    </div>

    <script>window.VITE_API_URL="%VITE_API_URL%";</script>
    <script src="/src/util/apiBase.js"></script>
    <script>
        (function () {
            "use strict";

            var API_BASE_URL = window.apiUrl("/").replace(/\/+$/, "");

            // Mirror of backend/src/utils/landingTemplates.js `file` fields. Kept
            // inline so the redirect is instant (no extra catalog round-trip).
            var TEMPLATE_FILES = {
                classic: "clinic-templates/classic.html",
                split: "clinic-templates/split.html",
                scroll: "clinic-templates/scroll.html"
            };
            var DEFAULT_TEMPLATE = "classic";

            var params = new URLSearchParams(window.location.search);
            var slug = params.get("clinic") || localStorage.getItem("clinicSlug");
            var preview = params.get("preview") === "1";
            // Builder live-preview override: preview an unsaved template choice
            // without persisting it first.
            var forceTemplate = params.get("template");

            function fileFor(templateId) {
                return TEMPLATE_FILES[templateId] || TEMPLATE_FILES[DEFAULT_TEMPLATE];
            }

            function go(templateId) {
                // Preserve the original query string (clinic, preview, template…)
                // so the destination page behaves exactly as before.
                window.location.replace("/" + fileFor(templateId) + window.location.search);
            }

            function fail(message) {
                var el = document.getElementById("loader-error");
                if (el) {
                    el.textContent = message;
                    el.style.display = "block";
                }
                // Still forward to the default layout so the destination page can
                // render its own, friendlier error state.
                setTimeout(function () { go(DEFAULT_TEMPLATE); }, 1200);
            }

            // Fast path: builder is forcing a specific (possibly unsaved) template.
            if (forceTemplate && TEMPLATE_FILES[forceTemplate]) {
                go(forceTemplate);
                return;
            }

            if (!slug) {
                // No clinic in the URL — let the default template show its error UI.
                go(DEFAULT_TEMPLATE);
                return;
            }

            // Resolve slug -> id -> published/draft template, then forward.
            fetch(API_BASE_URL + "/api/v1/tenants/slug/" + encodeURIComponent(slug))
                .then(function (r) { return r.json(); })
                .then(function (slugJson) {
                    var data = (slugJson && slugJson.data) || slugJson;
                    var id = data && data._id;
                    if (!id) { throw new Error("Clinic not found."); }
                    return fetch(API_BASE_URL + "/api/v1/tenants/" + id);
                })
                .then(function (r) { return r.json(); })
                .then(function (fullJson) {
                    var full = (fullJson && fullJson.data) || {};
                    var landing = full.landing || {};
                    var side = preview
                        ? (landing.draft || landing.published)
                        : (landing.published || landing.draft);
                    var templateId = side && TEMPLATE_FILES[side.template]
                        ? side.template
                        : DEFAULT_TEMPLATE;
                    go(templateId);
                })
                .catch(function () {
                    fail("We couldn't load this clinic. Redirecting…");
                });
        })();
    </script>
</body>

</html>
