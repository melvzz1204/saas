<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Duty Terminal | Clinic Flow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="bg-slate-50 text-slate-900 font-sans min-h-screen antialiased flex flex-col selection:bg-sky-500/20 selection:text-sky-900">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 backdrop-blur-md shadow-sm">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div
                        class="w-10 h-10 bg-sky-50 text-sky-600 border border-sky-200/60 rounded-xl flex items-center justify-center font-semibold shadow-inner">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span id="clinic-branch-title"
                            class="tracking-wide font-extrabold text-sm text-slate-900 uppercase">Loading
                            Workspace...</span>
                        <span class="text-[10px] font-black text-sky-600 uppercase tracking-widest mt-0.5">Live
                            Operations Flow</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <button id="btn-toggle-upcoming"
                        class="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer border border-slate-200">
                        <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                        </svg>
                        Upcoming Bookings
                    </button>

                    <button id="staff-logout-btn"
                        class="px-3.5 py-2 bg-white hover:bg-rose-50 hover:text-rose-600 text-slate-500 text-xs font-bold rounded-xl transition-all cursor-pointer border border-slate-200">
                        Exit Shift
                    </button>

                    <div class="flex items-center space-x-2 bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl">
                        <span
                            class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
                        <span id="staff-name-badge" class="text-xs font-bold text-slate-700 uppercase">Loading Duty
                            Staff...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 flex-1 w-full">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Lobby Queue</p>
                    <h3 id="stat-remaining" class="text-2xl font-black text-slate-900 tracking-tight">0 Waiting</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 border border-amber-200 rounded-xl text-xl">🛋️</div>
            </div>
            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Active Operations</p>
                    <h3 id="stat-active-chair" class="text-2xl font-black text-slate-900 tracking-tight">0 In Chair</h3>
                </div>
                <div class="p-3 bg-sky-50 text-sky-600 border border-sky-200 rounded-xl text-xl">🪑</div>
            </div>
            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Completed Today</p>
                    <h3 id="stat-completed" class="text-2xl font-black text-slate-900 tracking-tight">0 Sessions</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-xl text-xl">✅</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

            <div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-[720px] shadow-sm">
                <div class="flex items-center justify-between mb-4 px-1 pb-2 border-b border-slate-100">
                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.4)]"></span>
                        Lobby / Waiting
                    </h3>
                    <div class="flex items-center gap-2">
                        <span id="count-waiting"
                            class="bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-black px-2 py-0.5 rounded-md">0</span>
                        <button id="btn-open-walkin"
                            class="bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-md transition-colors cursor-pointer shadow-sm shadow-sky-600/10">
                            + Walk-In
                        </button>
                    </div>
                </div>
                <div id="col-waiting"
                    class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-thin scrollbar-thumb-slate-200">
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-[720px] shadow-sm">
                <div class="flex items-center justify-between mb-4 px-1 pb-2 border-b border-slate-100">
                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <span
                            class="w-2 h-2 rounded-full bg-sky-500 animate-pulse shadow-[0_0_8px_rgba(59,130,246,0.4)]"></span>
                        In Treatment
                    </h3>
                    <span id="count-treatment"
                        class="bg-sky-50 text-sky-700 border border-sky-200 text-[10px] font-black px-2 py-0.5 rounded-md">0</span>
                </div>
                <div id="col-treatment"
                    class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-thin scrollbar-thumb-slate-200">
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-[720px] shadow-sm">
                <div class="flex items-center justify-between mb-4 px-1 pb-2 border-b border-slate-100">
                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></span>
                        Checked Out
                    </h3>
                    <span id="count-completed"
                        class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-black px-2 py-0.5 rounded-md">0</span>
                </div>
                <div id="col-completed"
                    class="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-thin scrollbar-thumb-slate-200">
                </div>
            </div>

        </div>
    </main>

    <div id="walkin-modal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-black text-sm text-slate-800 uppercase tracking-wide">Patient Intake Registry</h3>
                <button id="btn-close-walkin"
                    class="text-slate-400 hover:text-slate-600 font-bold text-lg cursor-pointer">&times;</button>
            </div>
            <form id="form-walkin" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Patient
                        Name</label>
                    <input id="walkin-name" type="text" required placeholder="e.g. John Doe"
                        class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-hidden focus:border-sky-500 bg-slate-50 font-medium text-slate-800">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Primary
                        Reason /
                        Treatment</label>
                    <input id="walkin-reason" type="text" required placeholder="e.g. Routine Checkup"
                        class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-hidden focus:border-sky-500 bg-slate-50 font-medium text-slate-800">
                </div>
                <button type="submit"
                    class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold text-[11px] py-3 rounded-xl uppercase tracking-wider transition-colors cursor-pointer shadow-md shadow-sky-600/10">
                    Seat in Lobby 🛋️
                </button>
            </form>
        </div>
    </div>
    <div id="walkin-modal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 transition-all">
        <div
            class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
            <div class="bg-slate-50 border-b border-slate-200 p-4 flex justify-between items-center">
                <h3 class="font-black text-slate-700 text-xs uppercase tracking-widest">Register Walk-In</h3>
                <button id="btn-close-walkin"
                    class="text-slate-400 hover:text-rose-600 font-bold cursor-pointer transition-colors">✕</button>
            </div>
            <form id="form-walkin" class="p-5 space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-1.5">Patient
                        Name</label>
                    <input type="text" id="walkin-name" required
                        class="w-full text-sm bg-white border border-slate-200 text-slate-900 rounded-xl px-3 py-2.5 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 focus:outline-none transition-all placeholder-slate-400">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-1.5">Primary
                        Issue / Reason</label>
                    <input type="text" id="walkin-reason" placeholder="e.g., Toothache, Checkup" required
                        class="w-full text-sm bg-white border border-slate-200 text-slate-900 rounded-xl px-3 py-2.5 focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 focus:outline-none transition-all placeholder-slate-400">
                </div>
                <button type="submit"
                    class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs py-3 rounded-xl transition-all shadow-md uppercase tracking-wider mt-2 cursor-pointer shadow-sky-600/10">
                    Seat in Lobby
                </button>
            </form>
        </div>
    </div>

    <div id="upcoming-modal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 transition-all">
        <div
            class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
            <div
                class="p-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50">
                <div class="flex items-center gap-3">
                    <h3 class="text-xs font-black text-slate-700 flex items-center gap-2 uppercase tracking-widest">
                        Future Appointments Schedule
                    </h3>
                </div>
                <div class="flex items-center gap-2.5 self-end sm:self-auto">
                    <label for="filter-upcoming-range"
                        class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Group By:</label>
                    <select id="filter-upcoming-range"
                        class="bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 shadow-sm focus:outline-none focus:border-sky-500 cursor-pointer transition-all">
                        <option value="chronological">Sort</option>
                        <option value="day">Per Day Timeline</option>
                        <option value="month">Per Month Timeline</option>
                    </select>
                    <button id="btn-close-upcoming"
                        class="text-slate-400 hover:text-rose-600 ml-1 p-2 text-base font-bold rounded-lg transition-colors leading-none cursor-pointer">
                        ✕
                    </button>
                </div>
            </div>

            <div class="p-6 overflow-y-auto flex-1 bg-white scrollbar-thin scrollbar-thumb-slate-200">
                <div id="upcoming-table-container"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const role = localStorage.getItem("userRole");
            if (!localStorage.getItem("token") || role !== "staff") {
                window.location.replace("/staffLogin.html");
            }
        })();
    </script>
    <script type="module" src="/src/pages/staffDashboard.js"></script>
</body>

</html>
